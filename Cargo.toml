[workspace]
resolver = "2"
members = [
    "core",
    "cli",
    "networking",
    "edge",
]
default-members = ["core", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arxos/arxos"
rust-version = "1.75"

[workspace.dependencies]
arxos-core = { path = "core" }
arxos-networking = { path = "networking" }
anyhow = "1"
blake3 = "1"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
hex = "0.4"
iroh = "1"
mdns-sd = "0.11"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "signal"] }
tracing = "0.1"
ulid = { version = "1", features = ["serde"] }
tempfile = "3"
bytes = "1"
futures-lite = "2"
