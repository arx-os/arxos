[package]
name = "arxos-networking"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Arxos networking fabric: object sync over Iroh QUIC + mDNS discovery"

[features]
default = ["iroh", "mdns"]
# Real P2P transport (Iroh QUIC). Disable for pure in-process tests if desired.
iroh = ["dep:iroh"]
# Local-network discovery of peers and building heads.
mdns = ["dep:mdns-sd"]

[dependencies]
arxos-core = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
ciborium = { workspace = true }
futures-lite = { workspace = true }
hex = { workspace = true }
iroh = { workspace = true, optional = true }
mdns-sd = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[lib]
path = "src/lib.rs"
